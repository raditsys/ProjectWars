<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Project Wars: Adventure</title>
<link href="https://fonts.googleapis.com/css2?family=MedievalSharp&family=IM+Fell+English:ital@0;1&family=Share+Tech+Mono&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg: #0a0a0f;
  --surface: #12121a;
  --border: #2a2a3a;
  --gold: #f5c842;
  --gold2: #c8971f;
  --red: #e05252;
  --green: #4ade80;
  --blue: #60a5fa;
  --purple: #a78bfa;
  --text: #e8e0d0;
  --muted: #6b6058;
  --rs-brown: #3d2b1a;
  --rs-tan: #c8a96e;
  --rs-dark: #1a1208;
  --hp-green: #4ade80;
  --prayer-blue: #60a5fa;
  --xp-purple: #a78bfa;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Share Tech Mono', monospace;
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* ── HEADER ── */
#gameHeader {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.4rem 1rem;
  background: #0d0d14;
  border-bottom: 1px solid #2a2240;
  flex-shrink: 0;
  gap: 1rem;
  flex-wrap: wrap;
}
#gameTitle {
  font-family: 'IM Fell English', serif;
  font-size: 1.1rem;
  color: var(--gold);
  letter-spacing: 2px;
  white-space: nowrap;
}
#headerStats {
  display: flex;
  gap: 1rem;
  align-items: center;
  flex-wrap: wrap;
}
.stat-pill {
  display: flex;
  align-items: center;
  gap: 0.3rem;
  background: #1a1a26;
  border: 1px solid #2a2a3a;
  padding: 0.2rem 0.6rem;
  font-size: 0.7rem;
  letter-spacing: 1px;
}
.stat-pill .label { color: var(--muted); text-transform: uppercase; font-size: 0.6rem; }
.stat-pill .val   { color: var(--gold); font-weight: bold; }
.stat-pill.hp  .val { color: var(--hp-green); }
.stat-pill.pr  .val { color: var(--prayer-blue); }
.stat-pill.coins .val { color: var(--gold); }

#backBtn {
  background: none;
  border: 1px solid var(--muted);
  color: var(--muted);
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.65rem;
  padding: 0.3rem 0.7rem;
  cursor: pointer;
  letter-spacing: 1px;
  transition: all 0.15s;
  white-space: nowrap;
}
#backBtn:hover { border-color: var(--gold); color: var(--gold); }

/* ── MAIN LAYOUT ── */
#gameMain {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* ── 3D CANVAS ── */
#threeCanvas {
  flex: 1;
  display: block;
  cursor: crosshair;
}

/* ── RIGHT PANEL ── */
#rightPanel {
  width: 220px;
  background: #0e0e16;
  border-left: 1px solid #2a2240;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  flex-shrink: 0;
}

/* Panel tabs */
.panel-tabs {
  display: flex;
  border-bottom: 1px solid #2a2240;
}
.panel-tab {
  flex: 1;
  padding: 0.4rem 0.2rem;
  font-size: 0.75rem;
  text-align: center;
  cursor: pointer;
  border: none;
  background: none;
  color: var(--muted);
  transition: color 0.15s, background 0.15s;
  font-family: 'Share Tech Mono', monospace;
}
.panel-tab.active { color: var(--gold); background: #1a1624; border-bottom: 2px solid var(--gold); }
.panel-tab:hover:not(.active) { color: var(--text); }

.panel-body {
  flex: 1;
  overflow-y: auto;
  padding: 0.75rem;
  display: none;
}
.panel-body.active { display: block; }

/* ── INVENTORY ── */
#inventoryGrid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 3px;
}
.inv-slot {
  aspect-ratio: 1;
  background: #16161f;
  border: 1px solid #2a2240;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  position: relative;
  transition: border-color 0.1s;
  font-size: 1.2rem;
}
.inv-slot:hover { border-color: var(--gold); }
.inv-slot.filled { border-color: #3a3250; }
.inv-slot .item-count {
  position: absolute;
  bottom: 1px;
  right: 2px;
  font-size: 0.55rem;
  color: var(--gold);
  line-height: 1;
}
.inv-slot .item-name {
  display: none;
  position: absolute;
  bottom: calc(100% + 4px);
  left: 50%;
  transform: translateX(-50%);
  background: #0d0d14;
  border: 1px solid var(--gold);
  color: var(--text);
  padding: 0.2rem 0.4rem;
  font-size: 0.6rem;
  white-space: nowrap;
  z-index: 100;
  pointer-events: none;
}
.inv-slot:hover .item-name { display: block; }

/* ── EQUIPMENT ── */
#equipGrid {
  display: grid;
  grid-template-areas:
    ". head ."
    "shield body weapon"
    ". legs ."
    "ring . gloves"
    ". boots .";
  gap: 4px;
}
.equip-slot {
  aspect-ratio: 1;
  background: #16161f;
  border: 1px solid #2a2240;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.3rem;
  cursor: pointer;
  position: relative;
  transition: border-color 0.1s;
}
.equip-slot:hover { border-color: var(--gold); }
.equip-slot.filled { border-color: #4a3a60; }
.equip-slot .slot-label {
  position: absolute;
  bottom: 1px;
  left: 0; right: 0;
  text-align: center;
  font-size: 0.45rem;
  color: var(--muted);
  letter-spacing: 0.5px;
}
.equip-slot .item-name {
  display: none;
  position: absolute;
  bottom: calc(100% + 4px);
  left: 50%;
  transform: translateX(-50%);
  background: #0d0d14;
  border: 1px solid var(--gold);
  color: var(--text);
  padding: 0.2rem 0.4rem;
  font-size: 0.6rem;
  white-space: nowrap;
  z-index: 100;
  pointer-events: none;
}
.equip-slot:hover .item-name { display: block; }

/* ── SKILLS ── */
.skill-row {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.3rem 0;
  border-bottom: 1px solid #1a1a22;
}
.skill-icon { font-size: 1rem; width: 20px; text-align: center; }
.skill-info { flex: 1; }
.skill-name { font-size: 0.6rem; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; }
.skill-level { font-size: 0.85rem; color: var(--gold); font-weight: bold; }
.skill-xp-bar { height: 3px; background: #2a2240; margin-top: 2px; }
.skill-xp-fill { height: 100%; background: var(--xp-purple); transition: width 0.3s; }

/* ── CHAT/LOG ── */
#chatLog {
  flex: 1;
  overflow-y: auto;
  padding: 0.5rem;
  display: flex;
  flex-direction: column;
  gap: 0.2rem;
  max-height: 160px;
  border-top: 1px solid #2a2240;
}
.chat-msg {
  font-size: 0.65rem;
  letter-spacing: 0.5px;
  line-height: 1.4;
}
.chat-msg.info    { color: var(--text); }
.chat-msg.combat  { color: #ff8888; }
.chat-msg.skill   { color: var(--xp-purple); }
.chat-msg.loot    { color: var(--gold); }
.chat-msg.system  { color: var(--blue); }
.chat-msg.shop    { color: var(--green); }

/* ── CONTEXT MENU ── */
#ctxMenu {
  position: fixed;
  background: #0d0d14;
  border: 1px solid var(--gold);
  z-index: 500;
  min-width: 140px;
  display: none;
  box-shadow: 0 4px 20px rgba(0,0,0,0.6);
}
.ctx-item {
  padding: 0.4rem 0.8rem;
  font-size: 0.7rem;
  cursor: pointer;
  letter-spacing: 0.5px;
  transition: background 0.1s;
  color: var(--text);
}
.ctx-item:hover { background: #2a2240; color: var(--gold); }
.ctx-item.ctx-header { color: var(--gold); font-family: 'IM Fell English', serif; border-bottom: 1px solid #2a2240; cursor: default; }
.ctx-item.ctx-header:hover { background: none; }
.ctx-cancel { color: var(--red); }

/* ── SHOP MODAL ── */
#shopModal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.8);
  z-index: 400;
  display: none;
  align-items: center;
  justify-content: center;
}
#shopModal.open { display: flex; }
#shopBox {
  background: var(--rs-dark);
  border: 2px solid var(--gold);
  width: 480px;
  max-width: 95vw;
  max-height: 80vh;
  display: flex;
  flex-direction: column;
}
#shopBox h2 {
  font-family: 'IM Fell English', serif;
  font-size: 1.3rem;
  color: var(--gold);
  padding: 0.75rem 1rem;
  border-bottom: 1px solid #2a2240;
  letter-spacing: 2px;
}
#shopTabs {
  display: flex;
  border-bottom: 1px solid #2a2240;
}
.shop-tab-btn {
  flex: 1;
  padding: 0.4rem;
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.7rem;
  background: none;
  border: none;
  color: var(--muted);
  cursor: pointer;
  letter-spacing: 1px;
  transition: color 0.15s;
}
.shop-tab-btn.active { color: var(--gold); border-bottom: 2px solid var(--gold); }
#shopItems {
  flex: 1;
  overflow-y: auto;
  padding: 0.75rem;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.5rem;
  align-content: start;
}
.shop-item {
  background: #16161f;
  border: 1px solid #2a2240;
  padding: 0.6rem;
  display: flex;
  flex-direction: column;
  gap: 0.3rem;
  cursor: pointer;
  transition: border-color 0.15s;
}
.shop-item:hover { border-color: var(--gold); }
.shop-item-top { display: flex; align-items: center; gap: 0.5rem; }
.shop-item-icon { font-size: 1.5rem; }
.shop-item-name { font-size: 0.75rem; color: var(--text); letter-spacing: 0.5px; }
.shop-item-desc { font-size: 0.6rem; color: var(--muted); letter-spacing: 0.5px; }
.shop-item-price { font-size: 0.7rem; color: var(--gold); }
.shop-item-stats { font-size: 0.6rem; color: var(--green); letter-spacing: 0.5px; }
.shop-item-sell { font-size: 0.6rem; color: var(--purple); }
#shopFooter {
  padding: 0.75rem 1rem;
  border-top: 1px solid #2a2240;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
#shopGold { font-size: 0.8rem; color: var(--gold); }
#shopClose {
  background: none;
  border: 1px solid var(--red);
  color: var(--red);
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.7rem;
  padding: 0.3rem 0.8rem;
  cursor: pointer;
  letter-spacing: 1px;
}
#shopClose:hover { background: var(--red); color: #000; }

/* ── HP/PRAYER BARS ── */
#combatBars {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 220px;
  height: 36px;
  background: #0a0a12;
  border-top: 1px solid #2a2240;
  display: flex;
  align-items: center;
  padding: 0 1rem;
  gap: 1.5rem;
  z-index: 10;
}
.bar-wrap {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  flex: 1;
  max-width: 200px;
}
.bar-label { font-size: 0.6rem; color: var(--muted); letter-spacing: 1px; width: 28px; }
.bar-track {
  flex: 1;
  height: 12px;
  background: #1a1a22;
  border: 1px solid #2a2240;
  position: relative;
}
.bar-fill {
  height: 100%;
  transition: width 0.2s;
}
.bar-fill.hp     { background: var(--hp-green); }
.bar-fill.prayer { background: var(--prayer-blue); }
.bar-text {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.55rem;
  color: rgba(255,255,255,0.8);
  letter-spacing: 1px;
}
#combatLevel { font-size: 0.65rem; color: var(--gold); letter-spacing: 1px; }

/* ── FLOATING DAMAGE ── */
.dmg-float {
  position: fixed;
  font-family: 'IM Fell English', serif;
  font-size: 1.4rem;
  font-weight: bold;
  pointer-events: none;
  z-index: 200;
  text-shadow: 0 0 6px rgba(0,0,0,0.8), 1px 1px 0 #000;
  animation: dmgRise 0.9s ease-out forwards;
}
@keyframes dmgRise {
  0%   { opacity: 1; transform: translateY(0) scale(1.2); }
  100% { opacity: 0; transform: translateY(-60px) scale(0.8); }
}

/* ── XP TOAST ── */
.xp-toast {
  position: fixed;
  top: 60px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(13,13,20,0.9);
  border: 1px solid var(--xp-purple);
  color: var(--xp-purple);
  font-size: 0.75rem;
  padding: 0.3rem 0.8rem;
  letter-spacing: 1px;
  pointer-events: none;
  z-index: 300;
  animation: toastFade 2s ease forwards;
}
@keyframes toastFade {
  0%   { opacity: 0; transform: translateX(-50%) translateY(-8px); }
  15%  { opacity: 1; transform: translateX(-50%) translateY(0); }
  75%  { opacity: 1; }
  100% { opacity: 0; transform: translateX(-50%) translateY(-8px); }
}

/* ── ENEMY HP BAR ── */
.enemy-hp-bar {
  position: fixed;
  top: 50px;
  left: 50%;
  transform: translateX(-50%);
  width: 200px;
  background: #1a1a22;
  border: 1px solid #2a2240;
  padding: 0.3rem 0.5rem;
  display: none;
  z-index: 50;
}
.enemy-hp-bar.visible { display: block; }
.enemy-hp-name { font-size: 0.6rem; color: var(--red); letter-spacing: 1px; text-align: center; margin-bottom: 3px; }
.enemy-hp-track { height: 8px; background: #2a2240; }
.enemy-hp-fill  { height: 100%; background: var(--red); transition: width 0.2s; }

/* ── LEVEL UP ── */
#levelUpBanner {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0.8);
  background: rgba(10,10,20,0.95);
  border: 2px solid var(--gold);
  padding: 1.5rem 2.5rem;
  text-align: center;
  z-index: 600;
  display: none;
  animation: levelPop 0.3s ease forwards;
}
#levelUpBanner.show { display: block; }
@keyframes levelPop {
  from { transform: translate(-50%,-50%) scale(0.7); opacity: 0; }
  to   { transform: translate(-50%,-50%) scale(1);   opacity: 1; }
}
#levelUpBanner h2 {
  font-family: 'IM Fell English', serif;
  color: var(--gold);
  font-size: 1.6rem;
  letter-spacing: 3px;
}
#levelUpBanner p { font-size: 0.8rem; color: var(--text); margin-top: 0.5rem; letter-spacing: 1px; }

/* ── TOOLTIP ── */
#tooltip {
  position: fixed;
  background: #0d0d14;
  border: 1px solid var(--gold);
  padding: 0.4rem 0.6rem;
  font-size: 0.65rem;
  color: var(--text);
  pointer-events: none;
  z-index: 400;
  display: none;
  max-width: 180px;
  line-height: 1.5;
}

/* Scrollbars */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: #0a0a12; }
::-webkit-scrollbar-thumb { background: #2a2240; border-radius: 2px; }

/* ── RESPAWN SCREEN ── */
#respawnScreen {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  display: none;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 1rem;
  z-index: 700;
}
#respawnScreen.show { display: flex; }
#respawnScreen h2 {
  font-family: 'IM Fell English', serif;
  color: var(--red);
  font-size: 2rem;
  letter-spacing: 4px;
}
#respawnScreen p { color: var(--muted); font-size: 0.75rem; letter-spacing: 1px; }
#respawnBtn {
  background: var(--gold);
  color: #000;
  border: none;
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.9rem;
  letter-spacing: 2px;
  padding: 0.6rem 2rem;
  cursor: pointer;
  margin-top: 0.5rem;
}
</style>
</head>
<body>

<!-- HEADER -->
<div id="gameHeader">
  <div id="gameTitle">⚔ Project Wars: Adventure</div>
  <div id="headerStats">
    <div class="stat-pill hp"><span class="label">HP</span><span class="val" id="hpVal">10/10</span></div>
    <div class="stat-pill pr"><span class="label">Prayer</span><span class="val" id="prayerVal">10/10</span></div>
    <div class="stat-pill"><span class="label">CB</span><span class="val" id="cbVal">3</span></div>
    <div class="stat-pill coins"><span class="label">🪙 PW</span><span class="val" id="pwCoinsVal">—</span></div>
    <div class="stat-pill coins"><span class="label">GP</span><span class="val" id="gpVal">0</span></div>
  </div>
  <button id="backBtn" onclick="goBack()">← Back to Project Wars</button>
</div>

<!-- MAIN -->
<div id="gameMain">
  <canvas id="threeCanvas"></canvas>

  <!-- RIGHT PANEL -->
  <div id="rightPanel">
    <div class="panel-tabs">
      <button class="panel-tab active" onclick="switchPanel('inventory')" id="tabInv">🎒</button>
      <button class="panel-tab" onclick="switchPanel('equipment')" id="tabEquip">🛡</button>
      <button class="panel-tab" onclick="switchPanel('skills')" id="tabSkills">📊</button>
    </div>
    <!-- Inventory -->
    <div class="panel-body active" id="panelInventory">
      <div style="font-size:0.6rem;color:var(--muted);letter-spacing:1px;margin-bottom:0.5rem;">INVENTORY</div>
      <div id="inventoryGrid"></div>
    </div>
    <!-- Equipment -->
    <div class="panel-body" id="panelEquipment">
      <div style="font-size:0.6rem;color:var(--muted);letter-spacing:1px;margin-bottom:0.5rem;">EQUIPMENT</div>
      <div id="equipGrid">
        <div class="equip-slot" id="eq-head"   style="grid-area:head"   onclick="unequipSlot('head')">  <span class="slot-label">HEAD</span></div>
        <div class="equip-slot" id="eq-shield" style="grid-area:shield" onclick="unequipSlot('shield')"><span class="slot-label">OFFHAND</span></div>
        <div class="equip-slot" id="eq-body"   style="grid-area:body"   onclick="unequipSlot('body')">  <span class="slot-label">BODY</span></div>
        <div class="equip-slot" id="eq-weapon" style="grid-area:weapon" onclick="unequipSlot('weapon')"><span class="slot-label">WEAPON</span></div>
        <div class="equip-slot" id="eq-legs"   style="grid-area:legs"   onclick="unequipSlot('legs')">  <span class="slot-label">LEGS</span></div>
        <div class="equip-slot" id="eq-ring"   style="grid-area:ring"   onclick="unequipSlot('ring')">  <span class="slot-label">RING</span></div>
        <div class="equip-slot" id="eq-gloves" style="grid-area:gloves" onclick="unequipSlot('gloves')"><span class="slot-label">GLOVES</span></div>
        <div class="equip-slot" id="eq-boots"  style="grid-area:boots"  onclick="unequipSlot('boots')"> <span class="slot-label">BOOTS</span></div>
      </div>
      <div style="margin-top:0.75rem;font-size:0.6rem;color:var(--muted);letter-spacing:1px;">BONUSES</div>
      <div id="bonusDisplay" style="font-size:0.65rem;color:var(--green);margin-top:0.3rem;line-height:1.8;"></div>
    </div>
    <!-- Skills -->
    <div class="panel-body" id="panelSkills">
      <div id="skillsList"></div>
    </div>
  </div>
</div>

<!-- COMBAT BARS -->
<div id="combatBars">
  <div class="bar-wrap">
    <div class="bar-label">HP</div>
    <div class="bar-track">
      <div class="bar-fill hp" id="hpBar" style="width:100%"></div>
      <div class="bar-text" id="hpBarText">10 / 10</div>
    </div>
  </div>
  <div class="bar-wrap">
    <div class="bar-label">⚡</div>
    <div class="bar-track">
      <div class="bar-fill prayer" id="prayerBar" style="width:100%"></div>
      <div class="bar-text" id="prayerBarText">10 / 10</div>
    </div>
  </div>
  <div id="combatLevel">Cmb: 3</div>
  <div id="chatLog"></div>
</div>

<!-- ENEMY HP BAR -->
<div class="enemy-hp-bar" id="enemyHpBar">
  <div class="enemy-hp-name" id="enemyHpName">Goblin</div>
  <div class="enemy-hp-track"><div class="enemy-hp-fill" id="enemyHpFill" style="width:100%"></div></div>
</div>

<!-- CONTEXT MENU -->
<div id="ctxMenu"></div>

<!-- SHOP MODAL -->
<div id="shopModal">
  <div id="shopBox">
    <h2 id="shopTitle">🏪 General Store</h2>
    <div id="shopTabs"></div>
    <div id="shopItems"></div>
    <div id="shopFooter">
      <div id="shopGold">GP: <span id="shopGpDisplay">0</span> &nbsp;|&nbsp; 🪙 <span id="shopPwDisplay">0</span></div>
      <button id="shopClose" onclick="closeShop()">✕ Close</button>
    </div>
  </div>
</div>

<!-- LEVEL UP -->
<div id="levelUpBanner">
  <h2>LEVEL UP!</h2>
  <p id="levelUpText"></p>
</div>

<!-- RESPAWN -->
<div id="respawnScreen">

// XP table (level -> total XP needed)
function xpForLevel(lvl) {
  let xp = 0;
  for (let i = 1; i < lvl; i++) xp += Math.floor(i + 300 * Math.pow(2, i / 7));
  return Math.floor(xp / 4);
}
const XP_TABLE = Array.from({length:100}, (_, i) => xpForLevel(i + 1));

function levelFromXp(xp) {
  for (let i = 98; i >= 0; i--) if (xp >= XP_TABLE[i]) return i + 1;
  return 1;
}
function xpToNextLevel(skill) {
  const lvl = skill.level;
  if (lvl >= 99) return 0;
  const needed = XP_TABLE[lvl] - skill.xp;
  return Math.max(0, needed);
}
function xpProgress(skill) {
  const lvl = skill.level;
  if (lvl >= 99) return 1;
  const start = XP_TABLE[lvl - 1] || 0;
  const end   = XP_TABLE[lvl]     || 1;
  return Math.min(1, (skill.xp - start) / (end - start));
}

function calcCombatLevel() {
  const a = player.skills.attack.level, str = player.skills.strength.level,
        def = player.skills.defence.level, hp = player.skills.hitpoints.level,
        pr = player.skills.prayer.level;
  return Math.floor(0.25 * (def + hp + Math.floor(pr/2) + Math.floor(1.3 * (a + str))));
}

function getTotalBonus() {
  const b = { attack:0, strength:0, defence:0 };
  Object.values(player.equipment).forEach(item => {
    if (!item) return;
    if (item.bonus) Object.entries(item.bonus).forEach(([k,v]) => { if (b[k] !== undefined) b[k] += v; });
  });
  return b;
}

function getMaxHp() {
  return player.skills.hitpoints.level;
}
function getMaxPrayer() {
  return Math.max(1, player.skills.prayer.level);
}

}

function log(msg, type='info') {
  const chat = document.getElementById('chatLog');
  const div = document.createElement('div');
  div.className = 'chat-msg ' + type;
  div.textContent = msg;
  chat.appendChild(div);
  while (chat.children.length > 60) chat.removeChild(chat.firstChild);
  chat.scrollTop = chat.scrollHeight;
}

function showDmg(x, y, amount, color='#ff4444') {
  const el = document.createElement('div');
  el.className = 'dmg-float';
  el.textContent = amount === 0 ? '0' : amount;
  el.style.left = (x - 15) + 'px';
  el.style.top  = (y - 30) + 'px';
  el.style.color = color;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 900);
}

function xpToast(text) {
  const el = document.createElement('div');
  el.className = 'xp-toast';
  el.textContent = text;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2000);
}

function updateBars() {
  const hp = player.hp, mhp = player.maxHp;
  const pr = player.prayer, mpr = player.maxPrayer;
  document.getElementById('hpBar').style.width        = (hp / mhp * 100) + '%';
  document.getElementById('hpBarText').textContent    = hp + ' / ' + mhp;
  document.getElementById('prayerBar').style.width    = (pr / mpr * 100) + '%';
  document.getElementById('prayerBarText').textContent= pr + ' / ' + mpr;
  document.getElementById('hpVal').textContent    = hp + '/' + mhp;
  document.getElementById('prayerVal').textContent= pr + '/' + mpr;
  document.getElementById('cbVal').textContent    = player.combatLevel;
  document.getElementById('combatLevel').textContent = 'Cmb: ' + player.combatLevel;
  document.getElementById('gpVal').textContent    = player.gp.toLocaleString();
  // PW coins
  const pwc = localStorage.getItem('pwUserId') ? null : null;
  const saved = getPWCoins();
  document.getElementById('pwCoinsVal').textContent = saved !== null ? saved.toLocaleString() : '—';
}

function getPWCoins() {
  const uid = localStorage.getItem('pwUserId');
  if (!uid) return null;
  const v = localStorage.getItem('pwCoins_' + uid);
  return v !== null ? parseInt(v) : null;
}
function setPWCoins(n) {
  const uid = localStorage.getItem('pwUserId');
  if (!uid) return;
  localStorage.setItem('pwCoins_' + uid, n);
}

function renderInventory() {
  const grid = document.getElementById('inventoryGrid');
  grid.innerHTML = '';
  for (let i = 0; i < 28; i++) {
    const slot = document.createElement('div');
    slot.className = 'inv-slot';
    const item = player.inventory[i];
    if (item) {
      slot.classList.add('filled');
      slot.textContent = item.emoji || ITEMS[item.id]?.emoji || '?';
      if (item.count > 1) {
        const cnt = document.createElement('div');
        cnt.className = 'item-count';
        cnt.textContent = item.count;
        slot.appendChild(cnt);
      }
      const nm = document.createElement('div');
      nm.className = 'item-name';
      nm.textContent = ITEMS[item.id]?.name || item.id;
      slot.appendChild(nm);
      slot.onclick = (e) => { e.stopPropagation(); showItemCtx(i, e); };
    }
    grid.appendChild(slot);
  }
}

function renderEquipment() {
  const slots = ['head','body','legs','weapon','shield','ring','boots','gloves'];
  slots.forEach(slot => {
    const el = document.getElementById('eq-' + slot);
    if (!el) return;
    const item = player.equipment[slot];
    // Clear old content except slot label
    const label = el.querySelector('.slot-label');
    el.innerHTML = '';
    if (label) el.appendChild(label);
    if (item) {
      el.classList.add('filled');
      const icon = document.createElement('span');
      icon.textContent = item.emoji || ITEMS[item.id]?.emoji || '?';
      el.insertBefore(icon, label);
      const nm = document.createElement('div');
      nm.className = 'item-name';
      nm.textContent = item.name || ITEMS[item.id]?.name || item.id;
      el.appendChild(nm);
    } else {
      el.classList.remove('filled');
    }
  });

  const bonus = getTotalBonus();
  document.getElementById('bonusDisplay').innerHTML =
    `⚔ Atk: +${bonus.attack}  💪 Str: +${bonus.strength}  🛡 Def: +${bonus.defence}`;
}

function renderSkills() {
  const list = document.getElementById('skillsList');
  list.innerHTML = '';
  Object.entries(player.skills).forEach(([key, sk]) => {
    const row = document.createElement('div');
    row.className = 'skill-row';
    const prog = xpProgress(sk) * 100;
    row.innerHTML = `
      <div class="skill-icon">${sk.emoji}</div>
      <div class="skill-info">
        <div class="skill-name">${sk.name}</div>
        <div class="skill-level">${sk.level} <span style="font-size:0.55rem;color:var(--muted)">(${sk.xp.toLocaleString()} xp)</span></div>
        <div class="skill-xp-bar"><div class="skill-xp-fill" style="width:${prog}%"></div></div>

}

}

function addToInventory(itemId, count=1) {
  const itemDef = ITEMS[itemId];
  if (!itemDef) return false;

  if (itemId === 'coins_drop') {
    player.gp += count;
    updateBars();
    return true;
  }

  // Stack if stackable (food, materials, misc)
  const stackable = ['food','material','misc','currency','raw','potion'].includes(itemDef.type);
  if (stackable) {
    const existing = player.inventory.find(s => s && s.id === itemId);
    if (existing) { existing.count += count; renderInventory(); return true; }
  }

  const emptySlot = player.inventory.findIndex(s => s === null);
  if (emptySlot === -1) { log('Inventory is full!', 'system'); return false; }
  player.inventory[emptySlot] = { id: itemId, count, emoji: itemDef.emoji };
  renderInventory();
  return true;
}

function removeFromInventory(slotIdx, count=1) {
  const item = player.inventory[slotIdx];
  if (!item) return;
  item.count -= count;
  if (item.count <= 0) player.inventory[slotIdx] = null;
  renderInventory();
}

function showItemCtx(slotIdx, e) {
  const item = player.inventory[slotIdx];
  if (!item) return;
  const def = ITEMS[item.id];
  if (!def) return;

  const actions = [{ label: def.name, cls: 'ctx-header' }];

  if (def.type === 'weapon' || def.type === 'armour') {
    actions.push({ label: 'Equip', fn: () => equipItem(slotIdx) });
  }
  if (def.type === 'food') {
    actions.push({ label: `Eat (heals ${def.heals})`, fn: () => eatFood(slotIdx) });
  }
  if (def.type === 'raw') {
    actions.push({ label: 'Cook (campfire)', fn: () => cookItem(slotIdx) });
  }
  if (def.type === 'misc' && item.id === 'bones') {
    actions.push({ label: 'Bury (prayer xp)', fn: () => buryBones(slotIdx) });
  }
  if (def.type === 'potion') {
    actions.push({ label: 'Drink', fn: () => drinkPotion(slotIdx) });
  }
  actions.push({ label: `Drop (${def.sellPrice} gp)`, fn: () => { player.gp += def.sellPrice; removeFromInventory(slotIdx); updateBars(); log(`Dropped ${def.name} for ${def.sellPrice} gp.`, 'loot'); } });
  actions.push({ label: 'Cancel', cls: 'ctx-cancel' });

  showCtxMenu(actions, e.clientX, e.clientY);
}

function equipItem(slotIdx) {
  const item = player.inventory[slotIdx];
  if (!item) return;
  const def = ITEMS[item.id];
  if (!def || !def.slot) return;
  // Move existing equipped to inventory
  if (player.equipment[def.slot]) {
    addToInventory(player.equipment[def.slot].id);
  }
  player.equipment[def.slot] = def;
  player.inventory[slotIdx] = null;
  renderInventory();
  renderEquipment();
  player.maxHp = getMaxHp();
  player.maxPrayer = getMaxPrayer();
  updateBars();
  log(`Equipped ${def.name}.`, 'system');
}
window.equipItem = equipItem;

function unequipSlot(slot) {
  const item = player.equipment[slot];
  if (!item) return;
  if (!addToInventory(item.id)) return;
  player.equipment[slot] = null;
  renderEquipment();
  log(`Unequipped ${item.name}.`, 'system');
}
window.unequipSlot = unequipSlot;

function eatFood(slotIdx) {
  const item = player.inventory[slotIdx];
  if (!item) return;
  const def = ITEMS[item.id];
  if (!def || def.type !== 'food') return;
  const healed = Math.min(def.heals, player.maxHp - player.hp);
  player.hp = Math.min(player.maxHp, player.hp + def.heals);
  removeFromInventory(slotIdx);
  updateBars();
  log(`You eat the ${def.name} and heal ${healed} HP.`, 'skill');
}

function cookItem(slotIdx) {
  const item = player.inventory[slotIdx];
  if (!item) return;
  const def = ITEMS[item.id];
  if (!def || def.type !== 'raw') return;

  // Check proximity to campfire
  const dx = playerMesh.position.x - (-8), dz = playerMesh.position.z - 2;
  if (Math.sqrt(dx*dx + dz*dz) > 4) { log('You need to be near the campfire to cook!', 'system'); return; }

  removeFromInventory(slotIdx);
  // Chance to burn
  const cookLvl = player.skills.cooking.level;
  const burnChance = Math.max(0.05, 0.5 - cookLvl * 0.01);
  if (Math.random() < burnChance) {
    log('You accidentally burn the fish!', 'skill');
    gainXP('cooking', 3);
    return;
  }
  addToInventory(def.cookId);
  const xp = 30 + cookLvl * 2;
  gainXP('cooking', xp);
  log(`You cook the ${def.name.replace('Raw ', '')}.`, 'skill');
}

function buryBones(slotIdx) {
  removeFromInventory(slotIdx);
  gainXP('prayer', 4);
  player.maxPrayer = getMaxPrayer();
  player.prayer = Math.min(player.prayer + 1, player.maxPrayer);
  updateBars();
  log('You bury the bones.', 'skill');
}

function drinkPotion(slotIdx) {
  const item = player.inventory[slotIdx];
  if (!item) return;
  const def = ITEMS[item.id];
  if (!def || def.type !== 'potion') return;

  if (def.restoresPrayer) {
    player.prayer = Math.min(player.maxPrayer, player.prayer + def.restoresPrayer);
    log(`Prayer restored by ${def.restoresPrayer}.`, 'skill');
  }
  if (def.boostAttack) {
    player.boosts.attack = Math.max(player.boosts.attack, def.boostAttack);
    log(`Attack boosted by ${def.boostAttack}!`, 'skill');
    setTimeout(() => { player.boosts.attack = 0; }, 60000);
  }
  if (def.boostStrength) {
    player.boosts.strength = Math.max(player.boosts.strength, def.boostStrength);
    log(`Strength boosted by ${def.boostStrength}!`, 'skill');
    setTimeout(() => { player.boosts.strength = 0; }, 60000);
  }
  removeFromInventory(slotIdx);
  updateBars();
}

function gainXP(skillName, amount) {
  const sk = player.skills[skillName];
  if (!sk) return;
  sk.xp += amount;
  const newLevel = levelFromXp(sk.xp);
  if (newLevel > sk.level) {
    sk.level = newLevel;
    showLevelUp(sk.name, newLevel);
    if (skillName === 'hitpoints') { player.maxHp = newLevel; player.hp = Math.min(player.hp + 2, player.maxHp); }
    if (skillName === 'prayer')    { player.maxPrayer = newLevel; }
    player.combatLevel = calcCombatLevel();
    updateBars();
  }
  xpToast(`+${amount} ${sk.name} xp`);
  renderSkills();
}

function showLevelUp(skillName, level) {
  const banner = document.getElementById('levelUpBanner');
  document.getElementById('levelUpText').textContent = `${skillName} is now level ${level}!`;
  banner.classList.add('show');
  setTimeout(() => banner.classList.remove('show'), 2500);
}

// ══════════════════════════════════════════════════
// COMBAT
// ══════════════════════════════════════════════════

let combatInterval = null;

function startCombat(enemy) {
  if (enemy.state !== 'alive' || player.inCombat) return;
  player.inCombat = true;
  player.target = enemy;
  enemy.aggro = true;
  log(`You attack the ${enemy.name}!`, 'combat');
  updateEnemyBar(enemy);

  combatInterval = setInterval(() => {
    if (!player.target || player.target.state !== 'alive') {
      stopCombat();
      return;
    }
    playerAttack(player.target);
    if (player.target && player.target.state === 'alive') {
      enemyAttack(player.target);
    }
  }, player.attackSpeed);
}

function stopCombat() {
  player.inCombat = false;
  player.target = null;
  if (combatInterval) { clearInterval(combatInterval); combatInterval = null; }
  document.getElementById('enemyHpBar').classList.remove('visible');
}

function playerAttack(enemy) {
  const bonus = getTotalBonus();
  const atkLvl = player.skills.attack.level + player.boosts.attack;
  const strLvl = player.skills.strength.level + player.boosts.strength;
  const hitRoll = Math.floor(Math.random() * (atkLvl + bonus.attack + 3));
  const defRoll = Math.floor(Math.random() * (enemy.defence + 3));
  let dmg = 0;
  if (hitRoll > defRoll) {
    const maxHit = 1 + Math.floor((strLvl * (bonus.strength + 64) + 320) / 640);
    dmg = Math.floor(Math.random() * maxHit) + 1;
  }
  enemy.hp -= dmg;
  gainXP('attack', Math.floor(dmg * 4));
  gainXP('strength', Math.floor(dmg * 2));
  gainXP('hitpoints', Math.floor(dmg * 1.33));

  // Get screen position of enemy
  const pos = enemy.body.position.clone();
  pos.y += 1.5;
  const sp = worldToScreen(pos);
  showDmg(sp.x, sp.y, dmg, dmg > 0 ? '#ffdd44' : '#aaaaaa');
  updateEnemyBar(enemy);

  if (enemy.hp <= 0) killEnemy(enemy);
}

function enemyAttack(enemy) {
  const bonus = getTotalBonus();
  const hitRoll = Math.floor(Math.random() * (enemy.attack + 3));
  const defRoll = Math.floor(Math.random() * (player.skills.defence.level + bonus.defence + 3));
  let dmg = 0;
  if (hitRoll > defRoll) {
    dmg = Math.floor(Math.random() * enemy.attack) + 1;
    // Prayer reduces damage
    if (player.prayer > 0) {
      dmg = Math.floor(dmg * 0.7);
      player.prayer = Math.max(0, player.prayer - 0.5);
    }
  }
  player.hp -= dmg;
  gainXP('defence', Math.floor(dmg * 1.5));

  const sp = worldToScreen(playerMesh.position.clone().setY(2));
  showDmg(sp.x, sp.y, dmg, '#ff4444');
  updateBars();

  if (player.hp <= 0) playerDied();
}

function killEnemy(enemy) {
  enemy.state = 'dead';
  scene.remove(enemy.body);
  stopCombat();
  const combatXp = ENEMY_TEMPLATES[enemy.templateId].xp.combat;
  gainXP('attack', combatXp);
  gainXP('hitpoints', Math.floor(combatXp * 0.5));

  // GP drop
  const gp = enemy.gpDrop[0] + Math.floor(Math.random() * (enemy.gpDrop[1] - enemy.gpDrop[0]));
  if (gp > 0) { player.gp += gp; log(`You gain ${gp} gp.`, 'loot'); updateBars(); }

  // Item drops
  enemy.drops.forEach(drop => {
    if (Math.random() <= drop.chance) {
      const amount = drop.amount ? (drop.amount[0] + Math.floor(Math.random() * (drop.amount[1] - drop.amount[0]))) : 1;
      if (addToInventory(drop.id, amount)) {
        log(`Loot: ${ITEMS[drop.id]?.name || drop.id} (${amount})`, 'loot');
      }
    }
  });
  log(`You defeated the ${enemy.name}!`, 'combat');

  // Schedule respawn
  setTimeout(() => respawnEnemy(enemy), enemy.respawnTime);
}

function respawnEnemy(enemy) {
  const tmpl = ENEMY_TEMPLATES[enemy.templateId];
  enemy.hp = tmpl.hp;
  enemy.state = 'alive';
  enemy.body.position.set(enemy.spawnX, 0.6, enemy.spawnZ);
  scene.add(enemy.body);
}

function updateEnemyBar(enemy) {
  const bar = document.getElementById('enemyHpBar');
  bar.classList.add('visible');
  document.getElementById('enemyHpName').textContent = `${enemy.name} (${enemy.hp}/${enemy.maxHp})`;
  document.getElementById('enemyHpFill').style.width = Math.max(0, enemy.hp / enemy.maxHp * 100) + '%';
}

function playerDied() {
  stopCombat();
  player.hp = 1;
  // Teleport back
  playerMesh.position.set(0, 0, 0);
  moveTarget = null;
  document.getElementById('respawnScreen').classList.add('show');
}

function respawn() {
  document.getElementById('respawnScreen').classList.remove('show');
  player.hp = Math.floor(player.maxHp * 0.5);
  player.prayer = Math.floor(player.maxPrayer * 0.5);
  playerMesh.position.set(0, 0, 0);
  updateBars();
  log('You have respawned at Lumbridge.', 'system');
}
window.respawn = respawn;

let currentSkillAction = null;
let skillTimer = null;

function startWoodcutting(obj) {
  if (obj.state !== 'alive') { log('This tree has already been cut.', 'system'); return; }
  const minLevel = obj.type==='willow' ? 30 : obj.type==='oak' ? 15 : 1;
  if (player.skills.woodcutting.level < minLevel) {
    log(`You need level ${minLevel} Woodcutting to cut this.`, 'system'); return;
  }
  stopSkillAction();
  player.inCombat = false;
  const xpMap = { tree:25, oak:37, willow:67 };
  const logMap = { tree:'logs', oak:'oak_logs', willow:'willow_logs' };
  const timeMap = { tree:3000, oak:4500, willow:6000 };

  log(`You begin to chop the ${obj.name}...`, 'skill');

  skillTimer = setInterval(() => {
    if (obj.state !== 'alive') { stopSkillAction(); return; }
    if (Math.random() < 0.35 + player.skills.woodcutting.level * 0.005) {
      addToInventory(logMap[obj.type]);
      gainXP('woodcutting', xpMap[obj.type]);
      log(`You chop some ${ITEMS[logMap[obj.type]]?.name || 'logs'}.`, 'skill');
      // Chance to deplete
      if (Math.random() < 0.25) {
        obj.state = 'stump';
        obj.foliage.visible = false;
        log(`The ${obj.name} has been cut down!`, 'skill');
        stopSkillAction();
        setTimeout(() => {
          obj.state = 'alive';
          obj.foliage.visible = true;
          log(`A ${obj.name} has grown back.`, 'system');
        }, obj.respawnTime);
      }
    }
  }, timeMap[obj.type]);
  currentSkillAction = 'woodcutting';
}

function startMining(rock) {
  if (rock.state !== 'alive') { log('This rock is depleted.', 'system'); return; }
  if (player.skills.mining.level < rock.minLevel) {
    log(`You need level ${rock.minLevel} Mining for this.`, 'system'); return;
  }
  stopSkillAction();
  log(`You begin mining the ${rock.name}...`, 'skill');

  skillTimer = setInterval(() => {
    if (rock.state !== 'alive') { stopSkillAction(); return; }
    if (Math.random() < 0.4 + player.skills.mining.level * 0.005) {
      addToInventory(rock.drop);
      gainXP('mining', rock.xpPerOre);
      log(`You mine some ${ITEMS[rock.drop]?.name || rock.drop}.`, 'skill');
      if (Math.random() < 0.3) {
        rock.state = 'depleted';
        rock.mesh.visible = false;
        log(`The ${rock.name} has been depleted.`, 'skill');
        stopSkillAction();
        setTimeout(() => {
          rock.state = 'alive';
          rock.mesh.visible = true;
          log(`The ${rock.name} has respawned.`, 'system');
        }, rock.respawnTime);
      }
    }
  }, 3500);
  currentSkillAction = 'mining';
}

function startFishing(spot) {
  if (spot.state !== 'alive') { log('No fish here right now.', 'system'); return; }
  if (player.skills.fishing.level < spot.minLevel) {
    log(`You need level ${spot.minLevel} Fishing.`, 'system'); return;
  }
  stopSkillAction();
  log(`You begin fishing...`, 'skill');

  skillTimer = setInterval(() => {
    if (spot.state !== 'alive') { stopSkillAction(); return; }
    if (Math.random() < 0.45 + player.skills.fishing.level * 0.004) {
      if (!addToInventory(spot.drop)) { stopSkillAction(); return; }
      gainXP('fishing', spot.xp);
      log(`You catch some ${ITEMS[spot.drop]?.name || spot.drop}.`, 'skill');
    }
  }, 4000);
  currentSkillAction = 'fishing';
}

function stopSkillAction() {
  if (skillTimer) { clearInterval(skillTimer); skillTimer = null; }
  currentSkillAction = null;
}

// ══════════════════════════════════════════════════
// SHOP
// ══════════════════════════════════════════════════

let currentShopTab = 'Weapons & Armour';

function openShop() {
  stopSkillAction();
  stopCombat();
  renderShopTab(currentShopTab);
  document.getElementById('shopModal').classList.add('open');
  document.getElementById('shopGpDisplay').textContent = player.gp.toLocaleString();
  document.getElementById('shopPwDisplay').textContent = (getPWCoins() ?? '—');
  renderShopTabs();
}
window.openShop = openShop;

function closeShop() {
  document.getElementById('shopModal').classList.remove('open');
}
window.closeShop = closeShop;

function renderShopTabs() {
  const tabBar = document.getElementById('shopTabs');
  tabBar.innerHTML = '';
  Object.keys(SHOP_TABS).forEach(name => {
    const btn = document.createElement('button');
    btn.className = 'shop-tab-btn' + (name === currentShopTab ? ' active' : '');
    btn.textContent = name;
    btn.onclick = () => { currentShopTab = name; renderShopTabs(); renderShopTab(name); };
    tabBar.appendChild(btn);
  });
}

function renderShopTab(tab) {
  document.getElementById('shopTitle').textContent = '🏪 ' + tab;
  const container = document.getElementById('shopItems');
  container.innerHTML = '';
  SHOP_TABS[tab].forEach(itemId => {
    const def = ITEMS[itemId];
    if (!def) return;
    const el = document.createElement('div');
    el.className = 'shop-item';
    const gpPrice = def.price;
    const pwPrice = Math.ceil(def.price / 10); // 10 GP = 1 PW coin
    el.innerHTML = `
      <div class="shop-item-top">
        <div class="shop-item-icon">${def.emoji}</div>
        <div>
          <div class="shop-item-name">${def.name}</div>
          <div class="shop-item-desc">${def.desc}</div>
          ${def.bonus ? `<div class="shop-item-stats">${Object.entries(def.bonus).map(([k,v])=>`${k}:+${v}`).join(' ')}</div>` : ''}
        </div>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:0.3rem;">
        <div>
          <div class="shop-item-price">GP: ${gpPrice.toLocaleString()}</div>
          <div class="shop-item-sell" style="color:var(--purple)">🪙 ${pwPrice} PW coins</div>
        </div>
        <div style="display:flex;flex-direction:column;gap:0.25rem;">
          <button onclick="buyItemGP('${itemId}')" style="background:#1a3a1a;border:1px solid var(--green);color:var(--green);font-size:0.6rem;padding:0.2rem 0.5rem;cursor:pointer;font-family:'Share Tech Mono',monospace;letter-spacing:1px;">Buy (GP)</button>
          <button onclick="buyItemPW('${itemId}')" style="background:#1a1a3a;border:1px solid var(--purple);color:var(--purple);font-size:0.6rem;padding:0.2rem 0.5rem;cursor:pointer;font-family:'Share Tech Mono',monospace;letter-spacing:1px;">Buy (🪙 PW)</button>
        </div>
      </div>`;
    container.appendChild(el);
  });
}

window.buyItemGP = function(itemId) {
  const def = ITEMS[itemId];
  if (!def) return;
  if (player.gp < def.price) { log('Not enough GP!', 'system'); return; }
  if (!addToInventory(itemId)) return;
  player.gp -= def.price;
  updateBars();
  document.getElementById('shopGpDisplay').textContent = player.gp.toLocaleString();
  log(`Bought ${def.name} for ${def.price} gp.`, 'shop');
};

window.buyItemPW = function(itemId) {
  const def = ITEMS[itemId];
  if (!def) return;
  const pwCost = Math.ceil(def.price / 10);
  const current = getPWCoins();
  if (current === null) { log('Not logged in to Project Wars!', 'system'); return; }
  if (current < pwCost) { log(`Not enough PW coins! Need ${pwCost}.`, 'system'); return; }
  if (!addToInventory(itemId)) return;
  setPWCoins(current - pwCost);
  updateBars();
  document.getElementById('shopPwDisplay').textContent = (getPWCoins() ?? '—');
  log(`Bought ${def.name} for ${pwCost} PW coins.`, 'shop');
};

// Convert GP to PW coins (1000 GP = 1 PW coin, min 1)
window.convertGP = function() {
  if (player.gp < 1000) { log('Need at least 1000 GP to convert.', 'system'); return; }
  const coins = Math.floor(player.gp / 1000);
  const gpSpent = coins * 1000;
  const current = getPWCoins() ?? 0;
  player.gp -= gpSpent;
  setPWCoins(current + coins);
  updateBars();
  log(`Converted ${gpSpent} GP → +${coins} PW coins! Total: ${current + coins}`, 'shop');
};

// ══════════════════════════════════════════════════
// CONTEXT MENU
// ══════════════════════════════════════════════════

function showCtxMenu(actions, x, y) {
  const menu = document.getElementById('ctxMenu');
  menu.innerHTML = '';
  actions.forEach(a => {
    const div = document.createElement('div');
    div.className = 'ctx-item ' + (a.cls || '');
    div.textContent = a.label;
    if (a.fn) div.onclick = () => { hideCtxMenu(); a.fn(); };
    menu.appendChild(div);
  });
  menu.style.left = Math.min(x, window.innerWidth - 160) + 'px';
  menu.style.top  = Math.min(y, window.innerHeight - menu.scrollHeight - 10) + 'px';
  menu.style.display = 'block';
}

function hideCtxMenu() {
  document.getElementById('ctxMenu').style.display = 'none';
}

document.addEventListener('click', hideCtxMenu);

// ══════════════════════════════════════════════════
// INTERACTION (CLICK)
// ══════════════════════════════════════════════════

function worldToScreen(worldPos) {
  const v = worldPos.clone().project(camera);
  return {
    x: (v.x + 1) / 2 * canvas.clientWidth,
    y: (1 - (v.y + 1) / 2) * canvas.clientHeight,
  };
}

canvas.addEventListener('contextmenu', e => {
  e.preventDefault();
  handleClick(e, true);
});

canvas.addEventListener('click', e => {
  if (Math.abs(e.movementX) + Math.abs(e.movementY) > 5) return;
  handleClick(e, false);
});

function handleClick(e, rightClick) {
  const rect = canvas.getBoundingClientRect();
  mouse2d.x =  ((e.clientX - rect.left) / rect.width)  * 2 - 1;
  mouse2d.y = -((e.clientY - rect.top)  / rect.height) * 2 + 1;
  raycaster.setFromCamera(mouse2d, camera);

  // Check enemies
  for (const enemy of enemies) {
    if (enemy.state !== 'alive') continue;
    const hit = raycaster.intersectObject(enemy.body, true);
    if (hit.length > 0) {
      if (rightClick) {
        showCtxMenu([
          { label: enemy.name + ` (HP: ${enemy.hp})`, cls: 'ctx-header' },
          { label: 'Attack', fn: () => { moveToThenDo(enemy.body.position, () => startCombat(enemy)); } },
          { label: 'Examine', fn: () => log(`A ${enemy.name}. Looks dangerous.`, 'system') },
          { label: 'Cancel', cls: 'ctx-cancel' },
        ], e.clientX, e.clientY);
      } else {
        moveToThenDo(enemy.body.position, () => startCombat(enemy));
      }
      return;
    }
  }

  // Check world objects
  for (const obj of worldObjects) {
    const meshes = [obj.mesh || obj.trunk, obj.foliage].filter(Boolean);
    for (const mesh of meshes) {
      const hit = raycaster.intersectObject(mesh, true);
      if (hit.length > 0) {
        if (obj.emoji === '🌲' || obj.emoji === '🌳' || obj.emoji === '🌿') {
          const actions = [
            { label: obj.name, cls: 'ctx-header' },
            { label: 'Chop down', fn: () => moveToThenDo(new THREE.Vector3(obj.x, 0, obj.z), () => startWoodcutting(obj)) },
            { label: 'Examine', fn: () => log(`It's a ${obj.name}.`, 'system') },
            { label: 'Cancel', cls: 'ctx-cancel' },
          ];
          if (rightClick) showCtxMenu(actions, e.clientX, e.clientY);
          else moveToThenDo(new THREE.Vector3(obj.x, 0, obj.z), () => startWoodcutting(obj));
        } else if (obj.emoji === '⛏️') {
          const actions = [
            { label: obj.name, cls: 'ctx-header' },
            { label: 'Mine', fn: () => moveToThenDo(new THREE.Vector3(obj.x, 0, obj.z), () => startMining(obj)) },
            { label: 'Examine', fn: () => log(`It's a ${obj.name}.`, 'system') },
            { label: 'Cancel', cls: 'ctx-cancel' },
          ];
          if (rightClick) showCtxMenu(actions, e.clientX, e.clientY);
          else moveToThenDo(new THREE.Vector3(obj.x, 0, obj.z), () => startMining(obj));
        } else if (obj.emoji === '🎣') {
          const actions = [
            { label: obj.name, cls: 'ctx-header' },
            { label: 'Fish', fn: () => moveToThenDo(new THREE.Vector3(obj.x, 0, obj.z), () => startFishing(obj)) },
            { label: 'Examine', fn: () => log(`A fishing spot. ${ITEMS[obj.drop]?.name || ''} here.`, 'system') },
            { label: 'Cancel', cls: 'ctx-cancel' },
          ];
          if (rightClick) showCtxMenu(actions, e.clientX, e.clientY);
          else moveToThenDo(new THREE.Vector3(obj.x, 0, obj.z), () => startFishing(obj));
        }
        return;
      }
    }
  }

  // Check campfire (cook)
  const campHit = raycaster.intersectObject(campfire, true);
  if (campHit.length > 0) {
    showCtxMenu([
      { label: 'Campfire', cls: 'ctx-header' },
      { label: 'Cook (use raw fish from inventory)', fn: () => {
        const rawIdx = player.inventory.findIndex(s => s && ITEMS[s.id]?.type === 'raw');
        if (rawIdx === -1) { log('No raw food in inventory.', 'system'); return; }
        moveToThenDo(campfire.position, () => cookItem(rawIdx));
      }},
      { label: 'Cancel', cls: 'ctx-cancel' },
    ], e.clientX, e.clientY);
    return;
  }

  // Check shop NPC area
  const shopPos = new THREE.Vector3(-10, 0, 0);
  if (Math.abs(mouse2d.x) < 0.5) {
    const pt = new THREE.Vector3();
    raycaster.ray.intersectPlane(groundPlane, pt);
    if (pt && Math.abs(pt.x - shopPos.x) < 3 && Math.abs(pt.z - shopPos.z) < 3) {
      showCtxMenu([
        { label: 'Shop Keeper', cls: 'ctx-header' },
        { label: 'Trade', fn: () => moveToThenDo(shopPos, openShop) },
        { label: 'Convert GP → 🪙 PW coins', fn: () => convertGP() },
        { label: 'Cancel', cls: 'ctx-cancel' },
      ], e.clientX, e.clientY);
      return;
    }
  }

  // Click-to-move on ground
  const pt = new THREE.Vector3();
  if (raycaster.ray.intersectPlane(groundPlane, pt)) {
    stopSkillAction();
    moveTarget = pt.clone();
    moveTarget.y = 0;
    moveIndicator.position.copy(moveTarget);
    moveIndicator.position.y = 0.05;
    moveIndicator.visible = true;
    setTimeout(() => { moveIndicator.visible = false; }, 800);
  }
}

function moveToThenDo(targetPos, callback, range = 2.5) {
  stopSkillAction();
  const flat = new THREE.Vector3(targetPos.x, 0, targetPos.z);
  moveTarget = flat;
  const checkInterval = setInterval(() => {
    const dx = playerMesh.position.x - flat.x;
    const dz = playerMesh.position.z - flat.z;
    if (Math.sqrt(dx*dx + dz*dz) < range) {
      clearInterval(checkInterval);
      moveTarget = null;
      callback();
    }
  }, 100);
}

// ══════════════════════════════════════════════════
// CAMERA DRAG
// ══════════════════════════════════════════════════

canvas.addEventListener('mousedown', e => {
  if (e.button === 2) return;
  isDragging = true; lastMX = e.clientX; lastMY = e.clientY;
});
window.addEventListener('mouseup', () => isDragging = false);
window.addEventListener('mousemove', e => {
  if (!isDragging) return;
  const dx = e.clientX - lastMX, dy = e.clientY - lastMY;
  camAngleH -= dx * 0.005;
  camAngleV  = Math.max(0.2, Math.min(1.2, camAngleV + dy * 0.005));
  lastMX = e.clientX; lastMY = e.clientY;
});
canvas.addEventListener('wheel', e => {
  camDist = Math.max(6, Math.min(35, camDist + e.deltaY * 0.02));
});

// ══════════════════════════════════════════════════
// GAME LOOP
// ══════════════════════════════════════════════════

let lastFrame = 0;

function gameLoop(ts) {
  requestAnimationFrame(gameLoop);
  const dt = Math.min((ts - lastFrame) / 1000, 0.1);
  lastFrame = ts;

  // Resize
  const w = canvas.clientWidth, h = canvas.clientHeight - 36;
  if (canvas.width !== w || canvas.height !== h) {
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }

  // Move player toward target
  if (moveTarget) {
    const dx = moveTarget.x - playerMesh.position.x;
    const dz = moveTarget.z - playerMesh.position.z;
    const dist = Math.sqrt(dx*dx + dz*dz);
    if (dist < 0.15) {
      moveTarget = null;
    } else {
      const speed = MOVE_SPEED * dt;
      playerMesh.position.x += (dx / dist) * Math.min(speed, dist);
      playerMesh.position.z += (dz / dist) * Math.min(speed, dist);
      playerMesh.rotation.y = Math.atan2(dx, dz);
    }
  }

  // Enemy roaming
  const now = Date.now();
  enemies.forEach(enemy => {
    if (enemy.state !== 'alive') return;
    if (enemy.aggro) return;
    if (now - enemy.lastRoam > 3000 + Math.random() * 3000) {
      enemy.lastRoam = now;
      enemy.roamAngle += (Math.random() - 0.5) * 1.5;
      const nx = enemy.body.position.x + Math.cos(enemy.roamAngle) * 0.8;
      const nz = enemy.body.position.z + Math.sin(enemy.roamAngle) * 0.8;
      const ox = enemy.spawnX, oz = enemy.spawnZ;
      if (Math.sqrt((nx-ox)**2 + (nz-oz)**2) < 4) {
        enemy.body.position.x = nx;
        enemy.body.position.z = nz;
        enemy.body.rotation.y = enemy.roamAngle;
      }
    }
    // Idle bobbing
    enemy.body.position.y = 0.6 + Math.sin(now * 0.002 + enemy.roamAngle) * 0.03;
  });

  // Firelight flicker
  fireLight.intensity = 1.2 + Math.sin(now * 0.008) * 0.3 + Math.random() * 0.1;

  // Camera follow player
  const cx = playerMesh.position.x + Math.sin(camAngleH) * camDist * Math.cos(camAngleV);
  const cy = camDist * Math.sin(camAngleV);
  const cz = playerMesh.position.z + Math.cos(camAngleH) * camDist * Math.cos(camAngleV);
  camera.position.set(cx, cy, cz);
  camera.lookAt(playerMesh.position.x, playerMesh.position.y + 1, playerMesh.position.z);

  renderer.render(scene, camera);
}

// ══════════════════════════════════════════════════
// BACK TO PROJECT WARS
// ══════════════════════════════════════════════════

function goBack() {
  // Sync GP to PW coins — every 500 GP = 1 PW coin bonus on exit
  const bonus = Math.floor(player.gp / 500);
  if (bonus > 0) {
    const current = getPWCoins() ?? 0;
    setPWCoins(current + bonus);
    player.gp -= bonus * 500;
    log(`Saved! Earned ${bonus} PW coins from your adventure.`, 'shop');
  }
  window.close();
  // If opened as popup:
  if (window.opener) window.opener.location.reload();
}
window.goBack = goBack;

// ══════════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════════

function init() {
  player.maxHp = player.skills.hitpoints.level;
  player.hp    = player.maxHp;
  player.maxPrayer = player.skills.prayer.level;
  player.prayer    = player.maxPrayer;
  player.combatLevel = calcCombatLevel();

  renderInventory();
  renderEquipment();
  renderSkills();
  updateBars();

  // Starter items
  addToInventory('bronze_sword');
  addToInventory('wooden_shield');
  addToInventory('shrimp', 5);
  addToInventory('bones', 3);

  log('Welcome to Project Wars: Adventure!', 'system');
  log('Click enemies to attack. Right-click for options.', 'system');
  log('Chop trees, mine rocks, and fish in the lake.', 'system');
  log('Visit the shop (west building) to buy gear.', 'system');
  log('Convert GP → 🪙 PW coins at the shop.', 'system');

  requestAnimationFrame(gameLoop);
}

init();
