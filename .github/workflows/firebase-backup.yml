name: Firebase Realtime DB Backup

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Backup Firebase Realtime Database
        env:
          FIREBASE_DATABASE_URL: https://projectwars-60a92-default-rtdb.firebaseio.com
          FIREBASE_DATABASE_SECRET: ${{ secrets.FIREBASE_DATABASE_SECRET }}
        run: ./scripts/firebase_backup.sh

      - name: Commit and push backup
        run: |
          if [[ -z "$(git status --porcelain backups/firebase)" ]]; then
            echo "No backup changes to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backups/firebase
          git commit -m "chore: firebase backup $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push
